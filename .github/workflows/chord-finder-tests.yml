name: Chord finder tests

on:
  pull_request:
    paths:
      - "chord_finder/**"
      - ".github/workflows/chord-finder-tests.yml"
  push:
    paths:
      - "chord_finder/**"
      - ".github/workflows/chord-finder-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chord_finder
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run pytest
